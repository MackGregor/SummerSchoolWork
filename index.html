<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer Reading 2026 · Turner Kids</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@400;500;600&display=swap');
  :root {
    --cream: #FDF8F2; --ink: #1C1A16; --ink-light: #6B6660; --border: #E8E0D5;
    --winnie: #2A9D8F; --winnie-dark: #1A7A6E; --winnie-light: #E0F5F3;
    --sander: #E76F1A; --sander-dark: #C45A10; --sander-light: #FEF0E5;
    --leona: #7B3FE4; --leona-dark: #5E28C2; --leona-light: #EFE6FD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }

  /* ── HEADER ── */
  .site-header {
    padding: 28px 28px 0;
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 0;
  }
  .header-left h1 {
    font-family: 'Fraunces', serif; font-size: 28px; font-weight: 900; letter-spacing: -.5px; line-height: 1;
  }
  .header-left .subtitle { font-size: 13px; color: var(--ink-light); margin-top: 4px; margin-bottom: 16px; }
  .kid-tabs { display: flex; gap: 0; }
  .kid-tab {
    padding: 10px 22px 12px; cursor: pointer; font-size: 14px; font-weight: 600;
    color: var(--ink-light); border: none; background: none;
    border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .15s;
    display: flex; align-items: center; gap: 8px;
  }
  .kid-tab:hover { color: var(--ink); }
  .kid-tab.active[data-kid="winnie"] { color: var(--winnie-dark); border-bottom-color: var(--winnie); }
  .kid-tab.active[data-kid="sander"] { color: var(--sander-dark); border-bottom-color: var(--sander); }
  .kid-tab.active[data-kid="leona"]  { color: var(--leona-dark);  border-bottom-color: var(--leona);  }
  .kid-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .w-dot{background:var(--winnie);} .s-dot{background:var(--sander);} .l-dot{background:var(--leona);}
  .grade { font-size: 11px; color: var(--ink-light); font-weight: 400; }

  /* ── MAIN ── */
  .main { padding: 24px 28px 60px; max-width: 900px; }

  /* ── STATS ── */
  .stats-row { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 110px; background: white; border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-light); margin-bottom: 4px; }
  .stat-value { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 900; line-height: 1; }
  .stat-sub { font-size: 11px; color: var(--ink-light); margin-top: 3px; }
  .pbar { background: var(--border); border-radius: 99px; height: 5px; margin-top: 8px; overflow: hidden; }
  .pbar-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }

  /* ── PROGRAMS ── */
  .prog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .prog-card {
    border: 1.5px solid var(--border); border-left-width: 4px; border-radius: 12px;
    padding: 12px 13px; background: white;
  }
  .prog-name { font-size: 11px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
  .prog-link { font-size: 10px; text-decoration: none; display: block; margin-bottom: 6px; }
  .prog-link:hover { text-decoration: underline; }
  .prog-count-row { display: flex; align-items: baseline; gap: 4px; }
  .prog-count { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 900; }
  .prog-count-label { font-size: 11px; color: var(--ink-light); }
  .prog-goal { font-size: 10px; color: var(--ink-light); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); line-height: 1.5; }

  /* ── SECTION HEADS ── */
  .section-head {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-light); margin: 0 0 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── SCHOOL NOTE ── */
  .school-note {
    background: #FFFBEA; border: 1.5px solid #FFE58F; border-radius: 12px;
    padding: 11px 15px; margin-bottom: 18px; font-size: 12px; color: #7D5A00; line-height: 1.65;
  }

  /* ── ADD BAR ── */
  .add-bar { background: white; border: 1.5px solid var(--border); border-radius: 14px; padding: 15px 17px; margin-bottom: 16px; }
  .add-bar-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-light); margin-bottom: 10px; }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-row input, .add-row select {
    font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 8px 10px;
    border: 1.5px solid var(--border); border-radius: 9px; background: var(--cream); color: var(--ink); outline: none;
    transition: border-color .15s;
  }
  .add-row input:focus, .add-row select:focus { border-color: #aaa; }
  .f-title  { flex: 2; min-width: 130px; }
  .f-author { flex: 1.5; min-width: 110px; }
  .f-pages  { width: 78px; }
  .f-prog   { flex: 1; min-width: 155px; }
  .btn-add {
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
    padding: 8px 16px; border: none; border-radius: 9px; cursor: pointer; color: white; white-space: nowrap;
    transition: opacity .15s;
  }
  .btn-add:hover { opacity: .85; }

  /* ── BOOK CARDS ── */
  .book-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .book-card {
    background: white; border: 1.5px solid var(--border); border-radius: 13px;
    padding: 13px 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start;
  }
  .book-card.req { border-left-width: 4px; }
  .book-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 700; margin-bottom: 2px; line-height: 1.2; }
  .book-author { font-size: 12px; color: var(--ink-light); margin-bottom: 8px; }
  .book-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .tag-req { background: #FFF3CD; color: #856404; }
  .pages-txt { font-size: 11px; color: var(--ink-light); }

  .book-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; min-width: 88px; }
  .book-pct { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 900; }
  .done-badge { font-size: 11px; font-weight: 700; padding: 4px 9px; background: #E8F5E9; color: #2E7D32; border-radius: 99px; }
  .page-row { display: flex; align-items: center; gap: 5px; }
  .page-row input {
    width: 54px; font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 4px 6px;
    border: 1.5px solid var(--border); border-radius: 7px; background: var(--cream); text-align: center; outline: none;
  }
  .btn-save { font-size: 11px; font-weight: 600; padding: 4px 10px; border: none; border-radius: 7px; cursor: pointer; color: white; }
  .btn-save:hover { opacity: .85; }
  .btn-rm { font-size: 11px; color: var(--ink-light); background: none; border: none; cursor: pointer; padding: 0; }
  .btn-rm:hover { color: #C62828; }
  .set-row input {
    width: 58px; font-size: 11px; padding: 3px 6px;
    border: 1.5px solid var(--border); border-radius: 6px; background: var(--cream); text-align: center;
    font-family: 'DM Sans', sans-serif; outline: none;
  }
  .btn-set { font-size: 10px; font-weight: 600; padding: 4px 9px; border: none; border-radius: 6px; cursor: pointer; color: white; }

  .empty-state { text-align: center; padding: 32px 20px; color: var(--ink-light); font-size: 14px; }

  /* ── TASK CARDS ── */
  .task-card {
    background: white; border: 1.5px solid var(--border); border-left-width: 4px;
    border-radius: 13px; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .ixl-today-note { font-size:11px; font-weight:600; margin-top:6px; }
  .ixl-seg-bar { display:flex; gap:4px; margin-top:7px; align-items:flex-end; }
  .ixl-seg-wrap { display:flex; flex-direction:column; align-items:center; gap:2px; flex:1; }
  .ixl-seg-day { font-size:10px; font-weight:700; color:var(--ink-light); }
  .ixl-seg-track { width:100%; height:8px; background:var(--border); border-radius:99px; overflow:hidden; }
  .ixl-seg-fill { height:100%; border-radius:99px; transition:width .4s ease; }
  .ixl-seg-mins { font-size:9px; color:var(--ink-light); }

  .ixl-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .ixl-input { width: 58px; font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 4px 6px; border: 1.5px solid var(--border); border-radius: 7px; background: var(--cream); text-align: center; outline: none; }
  .ixl-label { font-size: 12px; color: var(--ink-light); white-space: nowrap; }

  .task-check-skip {
    width: 20px; height: 20px; border-radius: 5px; border: 2px solid #ccc;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: #bbb; font-weight: 700; font-size: 14px;
  }
  .task-check {
    width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border);
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .task-check.checked { border-color: #2E7D32; background: #2E7D32; }
  .task-check.checked::after { content: '✓'; color: white; font-size: 12px; font-weight: 700; }
  .task-body { flex: 1; }
  .task-title { font-size: 14px; font-weight: 600; }
  .task-title.checked { text-decoration: line-through; color: var(--ink-light); }
  .task-link { font-size: 11px; text-decoration: none; margin-top: 2px; display: inline-block; }
  .task-link:hover { text-decoration: underline; }
  .task-note { font-size: 11px; color: var(--ink-light); margin-top: 5px; line-height: 1.55; }
  .task-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #F3E8FF; color: #5E28C2; white-space: nowrap; align-self: flex-start; }
</style>
</head>

function ixlCard(b, idx, k) {
  // ixl0 = Friday only (15 min); ixl10 = Mon-Wed only (45 min); all others = 75 min
  const IXL_GOAL = b.id === 'ixl0' ? 15 : b.id === 'ixl10' ? 45 : 75;
  const mins    = b.ixlMins || 0;
  const done    = mins >= IXL_GOAL;
  const skipped = b.skipped;

  // Determine if this is the current week and which day we're on
  const TODAY_WEEK_ID = 'ixl9'; // Aug 10-14
  const TODAY_DAY     = 1;      // 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri
  const isCurrentWeek = b.id === TODAY_WEEK_ID;

  // Calculate total expected minutes through today across ALL weeks
  const allIxlWeeks = state.books[state.active].filter(bk => bk.ixl && !bk.skipped);
  const currentWeekIdx = allIxlWeeks.findIndex(bk => bk.id === TODAY_WEEK_ID);
  const ixlGoalFn    = bk => bk.id==='ixl0' ? 15 : bk.id==='ixl10' ? 45 : 75;
  const totalExpected = allIxlWeeks.slice(0, currentWeekIdx).reduce((s,bk) => s + ixlGoalFn(bk), 0) + (TODAY_DAY + 1) * 15;
  const totalLogged   = allIxlWeeks.reduce((s, bk, i) => {
    const goal = ixlGoalFn(bk);
    if (i < currentWeekIdx) return s + Math.min(bk.ixlMins || 0, goal);
    if (i === currentWeekIdx) return s + Math.min(bk.ixlMins || 0, (TODAY_DAY + 1) * 15);
    return s;
  }, 0);
  const totalBehind   = Math.max(0, totalExpected - totalLogged);

  // Build day segments
  function segBar() {
    const days = b.id === 'ixl0' ? 1 : b.id === 'ixl10' ? 3 : 5;
    const dayLabels = ['M','T','W','T','F'];
    const startDay  = b.id === 'ixl0' ? 4 : 0; // ixl0 is Friday only
    let html = '<div class="ixl-seg-bar">';
    for (let d = 0; d < days; d++) {
      const dayStart  = d * 15;
      const dayMins   = Math.min(Math.max(mins - dayStart, 0), 15);
      const dayPct    = Math.round(dayMins / 15 * 100);
      const dayLabel  = dayLabels[startDay + d];
      const isToday   = isCurrentWeek && (startDay + d) === TODAY_DAY;
      const todayStyle = isToday ? 'outline:2.5px solid ' + k.color + ';outline-offset:2px;border-radius:4px;' : '';
      html += '<div class="ixl-seg-wrap" style="' + todayStyle + '">'
        + '<div class="ixl-seg-day" style="' + (isToday ? 'color:' + k.color + ';font-size:11px;' : '') + '">' + dayLabel + (isToday ? ' ◀' : '') + '</div>'
        + '<div class="ixl-seg-track"><div class="ixl-seg-fill" style="width:' + dayPct + '%;background:' + k.color + '"></div></div>'
        + '<div class="ixl-seg-mins">' + dayMins + '</div>'
        + '</div>';
    }
    html += '</div>';
    if (isCurrentWeek) {
      const behind = totalBehind;
      html += '<div class="ixl-today-note" style="color:' + k.color + '">'
        + (behind > 0 ? '⚠️ ' + behind + ' min behind as of today (Tue Aug 11)' : '✅ Caught up through today (Tue Aug 11)')
        + '</div>';
    }
    return html;
  }

  return '<div class="task-card" style="border-left-color:' + (skipped ? '#bbb' : k.color) + (skipped ? ';opacity:0.7' : '') + (isCurrentWeek ? ';box-shadow:0 0 0 2px ' + k.color + '40;' : '') + '">'
    + (skipped
      ? '<div class="task-check-skip">–</div>'
      : (done
          ? '<div class="task-check checked"></div>'
          : '<div class="task-check"></div>'))
    + '<div class="task-body">'
    + '<div class="task-title" style="' + (skipped ? 'text-decoration:line-through;color:var(--ink-light)' : '') + '">'
    + esc(b.title)
    + (isCurrentWeek ? ' <span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:' + k.color + ';color:white;vertical-align:middle;margin-left:4px">THIS WEEK</span>' : '')
    + '</div>'
    + (skipped
      ? (b.taskNote ? '<div class="task-note">' + esc(b.taskNote) + '</div>' : '')
      : '<div class="ixl-row">'
        + '<input type="number" min="0" max="999" value="' + mins + '" id="ixl_' + idx + '" class="ixl-input" placeholder="0">'
        + '<span class="ixl-label">/ ' + IXL_GOAL + ' min</span>'
        + '<button class="btn-save" style="background:' + k.color + '" onclick="saveIxl(' + idx + ')">Save</button>'
        + '</div>'
        + segBar())
    + '</div>'
    + (done ? '<span class="done-badge">&#10003; Done</span>' : (skipped ? '' : '<span class="task-tag">💻 IXL</span>'))
    + '</div>';
}

function saveIxl(idx) {
  const v = Math.max(0, parseInt(document.getElementById('ixl_'+idx).value)||0);
  state.books[state.active][idx].ixlMins = v;
  persist(); render();
}
function toggleTask(idx) {
  state.books[state.active][idx].done = !state.books[state.active][idx].done;
  persist(); render();
}

function addBook() {
  const title = document.getElementById('iTitle').value.trim();
  if (!title) { document.getElementById('iTitle').focus(); return; }
  state.books[state.active].push({
    id: 'u' + (uid++),
    title,
    author:     document.getElementById('iAuthor').value.trim(),
    totalPages: parseInt(document.getElementById('iPages').value) || 0,
    pagesRead:  0,
    program:    document.getElementById('iProg').value,
    required:   false,
  });
  persist(); render();
}

function savePg(idx, max) {
  const v = Math.min(parseInt(document.getElementById('pg_'+idx).value)||0, max);
  state.books[state.active][idx].pagesRead = v;
  persist(); render();
}

function setTotal(idx) {
  const v = parseInt(document.getElementById('tp_'+idx).value)||0;
  if (v > 0) { state.books[state.active][idx].totalPages = v; persist(); render(); }
}

function rmBook(idx) {
  if (!confirm('Remove this book?')) return;
  state.books[state.active].splice(idx, 1);
  persist(); render();
}

document.getElementById('kidTabs').addEventListener('click', e => {
  const tab = e.target.closest('.kid-tab');
  if (!tab) return;
  document.querySelectorAll('.kid-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  state.active = tab.dataset.kid;
  render();
});

render();
</script>
</body>
</html>
